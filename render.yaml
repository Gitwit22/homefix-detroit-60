services:
  - type: web
    name: homefix-api
    runtime: node
    buildCommand: npm ci && npm run build:api
    preDeployCommand: npm run db:deploy
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: HOMEFIX_DEMO_MODE
        value: 1
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_SIGNED_URL_TTL_SECONDS
        value: 3600
      - key: N8N_TRIAGE_WEBHOOK_URL
        sync: false
      - key: N8N_HOMEFIX_SECRET
        sync: false
